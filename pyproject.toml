[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-price-tracker"
version = "2.0.0"
description = "Scrape flight prices and get email alerts when they drop below your threshold."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "selenium",
    "webdriver-manager",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
flight-tracker = "flight_tracker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
